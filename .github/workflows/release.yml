name: Publish verified images
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package version to publish (for example 0.3.0)'
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: image-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Verify release input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$VERSION" = "$(node -p 'require("./package.json").version')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Verify source
        run: |
          npm ci
          npm run check
      - name: Select registry namespace
        id: registry
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export authoritative build metadata
        run: |
          python3 deploy/runtime-pins.py --check
          python3 deploy/runtime-pins.py --format env >> "$GITHUB_ENV"
      - name: Runtime dependency image
        id: runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.prefix }}/${{ env.WORKER_RUNTIME_IMAGE }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            HYPERFRAMES_VERSION=${{ env.HYPERFRAMES_VERSION }}
          provenance: mode=max
          sbom: true
      - name: Hermes runtime base image
        id: hermes-runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/hermes/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.prefix }}/${{ env.HERMES_BASE_IMAGE }}
          build-args: |
            HERMES_COMMIT=${{ env.HERMES_COMMIT }}
            HERMES_ARCHIVE_SHA256=${{ env.HERMES_ARCHIVE_SHA256 }}
            SQLITE_AUTOCONF_VERSION=${{ env.SQLITE_AUTOCONF_VERSION }}
            SQLITE_SHA256=${{ env.SQLITE_SHA256 }}
            SQLITE_VERSION=${{ env.SQLITE_VERSION }}
          provenance: mode=max
          sbom: true
      - name: Build worker image for test
        id: worker-test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          platforms: linux/amd64
          load: true
          tags: ${{ steps.registry.outputs.prefix }}/omp-direct-executor:${{ inputs.version }}
          build-args: WORKER_RUNTIME_IMAGE=${{ steps.registry.outputs.prefix }}/${{ env.WORKER_RUNTIME_IMAGE_BASE }}@${{ steps.runtime.outputs.digest }}
          provenance: false
          sbom: false
      - name: Build Hermes image for test
        id: hermes-test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/hermes/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.registry.outputs.prefix }}/omp-hermes-executor:${{ inputs.version }}
          build-args: HERMES_BASE_IMAGE=${{ steps.registry.outputs.prefix }}/${{ env.HERMES_BASE_IMAGE_BASE }}@${{ steps.hermes-runtime.outputs.digest }}
          provenance: false
          sbom: false
      - name: Exercise final images with no-media smoke harness
        env:
          OMP_EXECUTOR_IMAGE: ${{ steps.registry.outputs.prefix }}/omp-direct-executor:${{ inputs.version }}
          HERMES_EXECUTOR_IMAGE: ${{ steps.registry.outputs.prefix }}/omp-hermes-executor:${{ inputs.version }}
        run: |
          python3 tools/smoke-executor.py --docker --no-build
      - name: Publish verified worker image
        id: worker-publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.prefix }}/omp-direct-executor:${{ inputs.version }}
          build-args: WORKER_RUNTIME_IMAGE=${{ steps.registry.outputs.prefix }}/${{ env.WORKER_RUNTIME_IMAGE_BASE }}@${{ steps.runtime.outputs.digest }}
          provenance: mode=max
          sbom: true
      - name: Publish verified Hermes image
        id: hermes-publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/hermes/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.prefix }}/omp-hermes-executor:${{ inputs.version }}
          build-args: HERMES_BASE_IMAGE=${{ steps.registry.outputs.prefix }}/${{ env.HERMES_BASE_IMAGE_BASE }}@${{ steps.hermes-runtime.outputs.digest }}
          provenance: mode=max
          sbom: true
      - name: Verify published platform config digests match tested local images
        env:
          PREFIX: ${{ steps.registry.outputs.prefix }}
          VERSION: ${{ inputs.version }}
          WORKER_DIGEST: ${{ steps.worker-publish.outputs.digest }}
          HERMES_DIGEST: ${{ steps.hermes-publish.outputs.digest }}
        run: |
          LOCAL_WORKER_ID=$(docker inspect --format='{{.Id}}' "$PREFIX/omp-direct-executor:$VERSION")
          LOCAL_HERMES_ID=$(docker inspect --format='{{.Id}}' "$PREFIX/omp-hermes-executor:$VERSION")
          WORKER_PLATFORM=$(docker buildx imagetools inspect "$PREFIX/omp-direct-executor@$WORKER_DIGEST" --raw | jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
          HERMES_PLATFORM=$(docker buildx imagetools inspect "$PREFIX/omp-hermes-executor@$HERMES_DIGEST" --raw | jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
          WORKER_CONFIG=$(docker buildx imagetools inspect "$PREFIX/omp-direct-executor@$WORKER_PLATFORM" --raw | jq -er '.config.digest')
          HERMES_CONFIG=$(docker buildx imagetools inspect "$PREFIX/omp-hermes-executor@$HERMES_PLATFORM" --raw | jq -er '.config.digest')
          test "$LOCAL_WORKER_ID" = "$WORKER_CONFIG"
          test "$LOCAL_HERMES_ID" = "$HERMES_CONFIG"
      - name: Record immutable deployment references
        env:
          PREFIX: ${{ steps.registry.outputs.prefix }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          HERMES_RUNTIME_DIGEST: ${{ steps.hermes-runtime.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker-publish.outputs.digest }}
          HERMES_DIGEST: ${{ steps.hermes-publish.outputs.digest }}
        run: |
          test -n "$RUNTIME_DIGEST"
          test -n "$HERMES_RUNTIME_DIGEST"
          test -n "$WORKER_DIGEST"
          test -n "$HERMES_DIGEST"
          printf 'SOURCE_COMMIT=%s\nWORKER_RUNTIME_IMAGE=%s/%s@%s\nHERMES_BASE_IMAGE=%s/%s@%s\nOMP_EXECUTOR_IMAGE=%s/omp-direct-executor@%s\nHERMES_EXECUTOR_IMAGE=%s/omp-hermes-executor@%s\n' "$GITHUB_SHA" "$PREFIX" "$WORKER_RUNTIME_IMAGE_BASE" "$RUNTIME_DIGEST" "$PREFIX" "$HERMES_BASE_IMAGE_BASE" "$HERMES_RUNTIME_DIGEST" "$PREFIX" "$WORKER_DIGEST" "$PREFIX" "$HERMES_DIGEST" > release-images.env
          cat release-images.env >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-images-${{ inputs.version }}
          path: release-images.env
          if-no-files-found: error
