name: omp-direct-executor

services:
  init-state:
    profiles: [bootstrap]
    image: ${OMP_EXECUTOR_IMAGE:-omp-direct-executor:0.3.0}
    user: "0:0"
    entrypoint: [python3.12, /opt/direct-executor/init-executor.py]
    volumes:
      - type: bind
        source: ${OMP_DIRECT_STATE_DIR:?Set OMP_DIRECT_STATE_DIR to a new absolute state directory outside the repo}
        target: /state
        bind: {create_host_path: false}
    network_mode: none
    restart: "no"

  init-assets:
    profiles: [media]
    image: ${OMP_EXECUTOR_IMAGE:-omp-direct-executor:0.3.0}
    entrypoint: [python3.12, /opt/direct-executor/prepare-assets.py]
    command: [/assets]
    volumes:
      - type: bind
        source: ${OMP_DIRECT_STATE_DIR}/assets
        target: /assets
        bind: {create_host_path: false}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  omp-executor:
    image: ${OMP_EXECUTOR_IMAGE:-omp-direct-executor:0.3.0}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      args:
        WORKER_RUNTIME_IMAGE: ${WORKER_RUNTIME_IMAGE:?WORKER_RUNTIME_IMAGE is required. Generate a separate env file with deploy/runtime-pins.py --format env and pass --env-file}
    environment:
      OMP_EXECUTOR_MODEL: ${OMP_EXECUTOR_MODEL:-}
      OMP_EXECUTOR_THINKING: ${OMP_EXECUTOR_THINKING:-medium}
      OMP_EXECUTOR_ARTIFACT_ROOT: /data/executor/artifacts
    expose: ["9876"]
    volumes:
      - type: bind
        source: ${OMP_DIRECT_STATE_DIR}/executor
        target: /data/executor
        bind: {create_host_path: false}
      - type: bind
        source: ${OMP_DIRECT_STATE_DIR}/omp-state
        target: /home/worker/.omp
        bind: {create_host_path: false}
      - type: bind
        source: ${OMP_DIRECT_STATE_DIR}/assets
        target: /assets
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMP_DIRECT_STATE_DIR}/font-cache
        target: /home/worker/.cache/omp-video-fonts
        bind: {create_host_path: false}
    secrets: [executor-token]
    tmpfs: ["/tmp:exec,mode=1777"]
    shm_size: 512m
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  hermes:
    image: ${HERMES_EXECUTOR_IMAGE:-omp-hermes-executor:0.3.0}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/hermes/Dockerfile
      args:
        HERMES_BASE_IMAGE: ${HERMES_BASE_IMAGE:?HERMES_BASE_IMAGE is required. Generate a separate env file with deploy/runtime-pins.py --format env and pass --env-file}
    command: [gateway, run]
    depends_on:
      omp-executor: {condition: service_healthy}
    environment:
      HOME: /opt/data
      OMP_EXECUTOR_HOST: omp-executor
      OMP_EXECUTOR_PORT: "9876"
      OMP_EXECUTOR_TOKEN_FILE: /run/secrets/executor-token
      OMP_EXECUTOR_TUNNEL: /opt/direct-executor/tcp_stdio.py
    volumes:
      - type: bind
        source: ${OMP_DIRECT_STATE_DIR}/hermes
        target: /opt/data
        bind: {create_host_path: false}
      - type: bind
        source: ../hermes-plugin/omp-executor
        target: /opt/data/plugins/omp-executor
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../hermes-skill/omp-orchestrator
        target: /opt/data/skills/omp-orchestrator
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../hermes-skill/omp-video
        target: /opt/data/skills/omp-video
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMP_DIRECT_STATE_DIR}/executor/artifacts
        target: /artifacts
        read_only: true
        bind: {create_host_path: false}
    secrets: [executor-token]
    tmpfs: ["/tmp:mode=1777"]
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

secrets:
  executor-token:
    file: ${OMP_DIRECT_STATE_DIR}/secrets/executor-token
